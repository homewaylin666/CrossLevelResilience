<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b03a3a"/></marker>
    <style>
      .t  { font-size: 34px; font-weight: 700; fill: #222; }
      .h  { font-size: 26px; font-weight: 700; }
      .b  { font-size: 23px; fill: #222; }
      .s  { font-size: 20px; fill: #555; }
      .box{ fill: #fff; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#ffffff"/>
  <text x="800" y="62" text-anchor="middle" class="t">Two-stage cut model</text>

  <!-- Data -->
  <rect x="50" y="330" width="210" height="150" rx="14" fill="#f2f2f2" stroke="#666" stroke-width="2"/>
  <text x="155" y="392" text-anchor="middle" class="h" fill="#333">Data</text>
  <text x="155" y="428" text-anchor="middle" class="s">demography</text>
  <text x="155" y="454" text-anchor="middle" class="s">(same data)</text>

  <!-- Stage 1 -->
  <rect x="320" y="120" width="500" height="560" rx="18" fill="#e9f1fb" stroke="#1560b8" stroke-width="3"/>
  <text x="570" y="168" text-anchor="middle" class="h" fill="#1560b8">Stage 1 · Trait</text>
  <rect class="box" x="360" y="200" width="420" height="110" rx="10" stroke="#1560b8"/>
  <text x="570" y="248" text-anchor="middle" class="b">Baseline vital rates</text>
  <text x="570" y="282" text-anchor="middle" class="s">(no trait)</text>
  <rect class="box" x="360" y="350" width="420" height="110" rx="10" stroke="#1560b8"/>
  <text x="570" y="398" text-anchor="middle" class="b">IPM per species</text>
  <text x="570" y="432" text-anchor="middle" class="s">per posterior draw s</text>
  <rect class="box" x="360" y="500" width="420" height="140" rx="10" stroke="#1560b8"/>
  <text x="570" y="550" text-anchor="middle" class="b">Trait draws  T<tspan font-size="16" dy="8">k</tspan><tspan font-size="16" dy="-20">(s)</tspan></text>
  <text x="570" y="592" text-anchor="middle" class="s">GenTime, Iteroparity, …</text>
  <text x="570" y="618" text-anchor="middle" class="s">(full posterior, no mean ± SE)</text>
  <line x1="570" y1="310" x2="570" y2="346" stroke="#1560b8" stroke-width="2.5" marker-end="url(#ak)"/>
  <line x1="570" y1="460" x2="570" y2="496" stroke="#1560b8" stroke-width="2.5" marker-end="url(#ak)"/>

  <!-- Stage 2 -->
  <rect x="960" y="120" width="500" height="560" rx="18" fill="#eaf6ec" stroke="#1e6b2a" stroke-width="3"/>
  <text x="1210" y="168" text-anchor="middle" class="h" fill="#1e6b2a">Stage 2 · Response</text>
  <rect class="box" x="1000" y="200" width="420" height="110" rx="10" stroke="#1e6b2a"/>
  <text x="1210" y="248" text-anchor="middle" class="b">Full model × M</text>
  <text x="1210" y="282" text-anchor="middle" class="s">one trait draw per run</text>
  <rect class="box" x="1000" y="350" width="420" height="110" rx="10" stroke="#1e6b2a"/>
  <text x="1210" y="398" text-anchor="middle" class="b">Pool M posteriors</text>
  <text x="1210" y="432" text-anchor="middle" class="s">(multiple imputation)</text>
  <rect class="box" x="1000" y="500" width="420" height="140" rx="10" stroke="#1e6b2a"/>
  <text x="1210" y="545" text-anchor="middle" class="b">trait → <tspan font-style="italic">γ, β</tspan><tspan font-size="16" dy="6">intra</tspan><tspan dy="-6">, </tspan><tspan font-style="italic">β</tspan><tspan font-size="16" dy="6">inter</tspan><tspan dy="-6">, </tspan><tspan font-style="italic">β</tspan><tspan font-size="16" dy="6">climate</tspan></text>
  <text x="1210" y="590" text-anchor="middle" class="b"><tspan font-style="italic">α</tspan><tspan font-size="16" dy="6">0</tspan><tspan dy="-6">, </tspan><tspan font-style="italic">α</tspan><tspan font-size="16" dy="6">1</tspan><tspan dy="-6">, </tspan><tspan font-style="italic">α</tspan><tspan font-size="16" dy="6">2</tspan><tspan dy="-6">: trait-free</tspan></text>
  <text x="1210" y="620" text-anchor="middle" class="s">(trait is built from them)</text>
  <line x1="1210" y1="310" x2="1210" y2="346" stroke="#1e6b2a" stroke-width="2.5" marker-end="url(#ak)"/>
  <line x1="1210" y1="460" x2="1210" y2="496" stroke="#1e6b2a" stroke-width="2.5" marker-end="url(#ak)"/>

  <!-- Data → both stages -->
  <path d="M260,370 C290,370 300,255 356,255" fill="none" stroke="#333" stroke-width="2.5" marker-end="url(#ak)"/>
  <path d="M155,480 L155,770 L1210,770 L1210,684" fill="none" stroke="#333" stroke-width="2.5" marker-end="url(#ak)"/>

  <!-- Draws → Stage 2 (forward) -->
  <path d="M780,540 L845,540 L845,255 L996,255" fill="none" stroke="#333" stroke-width="3" marker-end="url(#ak)"/>
  <text x="902" y="238" text-anchor="middle" class="b" font-weight="700">M draws</text>

  <!-- Cut: no feedback -->
  <path d="M1000,430 C930,440 930,625 784,625" fill="none" stroke="#b03a3a" stroke-width="3" stroke-dasharray="10,7" marker-end="url(#ar)"/>
  <g transform="translate(915,545)">
    <circle r="20" fill="#fff" stroke="#b03a3a" stroke-width="2.5"/>
    <line x1="-12" y1="-12" x2="12" y2="12" stroke="#b03a3a" stroke-width="4"/>
    <line x1="-12" y1="12" x2="12" y2="-12" stroke="#b03a3a" stroke-width="4"/>
  </g>
  <text x="905" y="672" text-anchor="middle" class="h" fill="#b03a3a">Cut</text>
  <text x="905" y="698" text-anchor="middle" class="s" fill="#b03a3a">no feedback</text>

  <!-- Output -->
  <rect x="1500" y="330" width="80" height="150" rx="12" fill="#fff4e0" stroke="#b0641a" stroke-width="2"/>
  <text x="1540" y="414" text-anchor="middle" class="h" fill="#8a4a10"><tspan font-style="italic">d</tspan><tspan font-size="18" dy="6">1</tspan></text>
  <line x1="1420" y1="570" x2="1460" y2="570" stroke="#333" stroke-width="2.5"/>
  <path d="M1460,570 L1480,570 L1480,405 L1496,405" fill="none" stroke="#333" stroke-width="2.5" marker-end="url(#ak)"/>

  <!-- Check -->
  <text x="800" y="840" text-anchor="middle" class="s">Check: simulate with true <tspan font-style="italic">d</tspan><tspan font-size="14" dy="5">1</tspan><tspan dy="-5"> = 0 → recovered </tspan><tspan font-style="italic">d</tspan><tspan font-size="14" dy="5">1</tspan><tspan dy="-5"> ≈ 0</tspan></text>
</svg>
