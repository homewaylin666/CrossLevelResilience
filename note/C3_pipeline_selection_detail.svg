<text x="330.0" y="561.5" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:15.5px;fill:#111">Selected model_before</text>
<text x="330.0" y="580.5" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:15.5px;fill:#111">(refitted in NIMBLE: arrow 4)</text>
<path d="M550.0,438.5 L598.0,438.5" stroke="#111" stroke-width="2" stroke-dasharray="5,4" fill="none" marker-end="url(#a)"/>
<rect x="602.0" y="397" width="250" height="83" fill="#fff" stroke="#555" stroke-width="1.5" stroke-dasharray="6,4"/>
