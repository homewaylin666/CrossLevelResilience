<text x="330.0" y="424.5" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:15.5px;fill:#111">Interaction terms: every subset, main effects fixed</text>
<text x="330.0" y="443.5" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:15.5px;fill:#111">(survival, growth 2¹⁵; recruitment 2⁹);</text>
<text x="330.0" y="462.5" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:15.5px;fill:#111">lowest AICc (Gupta et al. 2025), BIC alongside</text>
