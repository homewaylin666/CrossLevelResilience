<text x="330.0" y="306.5" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:15.5px;fill:#111">the previous year or both, or summer temperature;</text>
<text x="330.0" y="325.5" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:15.5px;fill:#111">leave-one-year-out prediction</text>
