<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" width="900" height="720" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto"><path d="M0,0 10,5 0,10Z" fill="#111"/></marker></defs>
<rect width="900" height="720" fill="#fff"/>
<rect x="110.0" y="20" width="440" height="72" fill="#d6d6d6"/>
<text x="330.0" y="51.5" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:15.5px;fill:#111">Full model_before (Bayesian, NIMBLE)</text>
