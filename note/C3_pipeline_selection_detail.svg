<text x="330.0" y="169.5" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:15.5px;fill:#111">Random-effect structure (glmmTMB): leave out</text>
<text x="330.0" y="188.5" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:15.5px;fill:#111">variances estimated at zero in the full model</text>
