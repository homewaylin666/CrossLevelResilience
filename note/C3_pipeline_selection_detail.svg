<path d="M550.0,668 L598.0,668" stroke="#111" stroke-width="2" stroke-dasharray="5,4" fill="none" marker-end="url(#a)"/>
<rect x="602.0" y="634" width="250" height="69" fill="#fff" stroke="#555" stroke-width="1.5" stroke-dasharray="6,4"/>
<text x="727.0" y="654.5" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:15.5px;fill:#111">Exploratory: AICc ranking</text>
<text x="727.0" y="673.5" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:15.5px;fill:#111">of every subset of</text>
<text x="727.0" y="692.5" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:15.5px;fill:#111">the trait terms (2⁶)</text>
