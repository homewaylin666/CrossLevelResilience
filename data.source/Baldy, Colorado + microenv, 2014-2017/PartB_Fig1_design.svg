<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" font-family="Helvetica, Arial, sans-serif">

  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/>
    </marker>
  </defs>

  <rect width="1000" height="620" fill="#ffffff"/>

  <!-- ============ TITLE ============ -->
  <g id="title">
    <text x="40" y="40" font-size="22" font-weight="bold" fill="#111">Part 2 — Counterfactual simulation design</text>
    <text x="40" y="64" font-size="13" fill="#666">4 climate sequences  ×  4 interaction scenarios  ×  4000 posterior draws</text>
    <text x="40" y="82" font-size="12" fill="#8e44ad">Interactions always occur and always track density — only their response to environment is switched off.</text>
  </g>

  <!-- ============ PIPELINE ============ -->
  <g id="pipeline">
    <rect x="40" y="92" width="200" height="58" rx="6" fill="#eef2f7" stroke="#9aa9bb"/>
    <text x="140" y="116" font-size="13" font-weight="bold" text-anchor="middle" fill="#233">Fitted model (Part 1)</text>
    <text x="140" y="134" font-size="11" text-anchor="middle" fill="#556">posterior draws</text>

    <line x1="248" y1="121" x2="292" y2="121" stroke="#444" stroke-width="1.6" marker-end="url(#arw)"/>

    <rect x="300" y="92" width="240" height="58" rx="6" fill="#eef2f7" stroke="#9aa9bb"/>
    <text x="420" y="112" font-size="13" font-weight="bold" text-anchor="middle" fill="#233">Forward simulation</text>
    <text x="420" y="130" font-size="11" text-anchor="middle" fill="#556">neighbourhoods recomputed</text>
    <text x="420" y="144" font-size="11" text-anchor="middle" fill="#556">every year</text>

    <line x1="548" y1="121" x2="592" y2="121" stroke="#444" stroke-width="1.6" marker-end="url(#arw)"/>

    <rect x="600" y="92" width="230" height="58" rx="6" fill="#eef2f7" stroke="#9aa9bb"/>
    <text x="715" y="112" font-size="13" font-weight="bold" text-anchor="middle" fill="#233">Resilience metrics</text>
    <text x="715" y="130" font-size="11" text-anchor="middle" fill="#556">stability · resistance</text>
    <text x="715" y="144" font-size="11" text-anchor="middle" fill="#556">recovery time</text>
  </g>

  <text x="40" y="192" font-size="14" font-weight="bold" fill="#111">Design grid — every cell is one simulation set</text>

  <!-- ============ COLUMN HEADERS : climate sequences ============ -->
  <g id="climate-headers">

    <g id="clim-observed">
      <rect x="282" y="206" width="152" height="60" rx="4" fill="#fbfcfd" stroke="#dde3ea"/>
      <polyline points="292,238 315,252 338,231 361,245 384,256 407,234 430,242"
                fill="none" stroke="#3d6fa8" stroke-width="1.8"/>
      <text x="358" y="282" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#233">Observed</text>
    </g>

    <g id="clim-shuffled">
      <rect x="446" y="206" width="152" height="60" rx="4" fill="#fbfcfd" stroke="#dde3ea"/>
      <polyline points="456,245 479,234 502,256 525,242 548,231 571,252 594,238"
                fill="none" stroke="#3d6fa8" stroke-width="1.8"/>
      <text x="522" y="282" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#233">Reordered</text>
    </g>

    <g id="clim-clustered">
      <rect x="610" y="206" width="152" height="60" rx="4" fill="#fbfcfd" stroke="#dde3ea"/>
      <polyline points="620,234 643,231 666,238 689,258 712,260 735,234 758,238"
                fill="none" stroke="#3d6fa8" stroke-width="1.8"/>
      <rect x="681" y="212" width="40" height="48" fill="#e8a33d" opacity="0.18"/>
      <text x="686" y="282" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#233">Clustered drought</text>
    </g>

    <g id="clim-constant">
      <rect x="774" y="206" width="152" height="60" rx="4" fill="#fbfcfd" stroke="#dde3ea"/>
      <polyline points="784,240 807,240 830,240 853,240 876,240 899,240 918,240"
                fill="none" stroke="#3d6fa8" stroke-width="1.8"/>
      <text x="850" y="282" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#233">Constant (mean)</text>
    </g>

    <text x="604" y="200" font-size="11" text-anchor="middle" fill="#888">built by permuting observed years — no extrapolation</text>
  </g>

  <!-- ============ ROW LABELS : interaction scenarios ============ -->
  <g id="scenario-rows">

    <g id="row-full">
      <rect x="40" y="300" width="228" height="50" rx="4" fill="#f4f6f8" stroke="#cfd7e0"/>
      <circle cx="60" cy="325" r="7" fill="#1a1a1a"/>
      <text x="78" y="321" font-size="12.5" font-weight="bold" fill="#111">Full</text>
      <text x="78" y="338" font-size="10.5" fill="#666">interactions free to vary</text>
    </g>

    <g id="row-freeze-inter">
      <rect x="40" y="360" width="228" height="50" rx="4" fill="#f4f6f8" stroke="#cfd7e0"/>
      <circle cx="60" cy="385" r="7" fill="#e67e22"/>
      <text x="78" y="381" font-size="12.5" font-weight="bold" fill="#111">Freeze (b) interspecific</text>
      <text x="78" y="398" font-size="10.5" fill="#666">ω-inter = 0,  δ-inter = 0</text>
    </g>

    <g id="row-freeze-intra">
      <rect x="40" y="420" width="228" height="50" rx="4" fill="#f4f6f8" stroke="#cfd7e0"/>
      <circle cx="60" cy="445" r="7" fill="#c0392b"/>
      <text x="78" y="441" font-size="12.5" font-weight="bold" fill="#111">Freeze (a) intraspecific</text>
      <text x="78" y="458" font-size="10.5" fill="#666">ω-intra = 0,  δ-intra = 0</text>
    </g>

    <g id="row-freeze-both">
      <rect x="40" y="480" width="228" height="50" rx="4" fill="#f4f6f8" stroke="#cfd7e0"/>
      <circle cx="60" cy="505" r="7" fill="#8e44ad"/>
      <text x="78" y="501" font-size="12.5" font-weight="bold" fill="#111">Freeze both</text>
      <text x="78" y="518" font-size="10.5" fill="#666">all four set to 0</text>
    </g>
  </g>

  <!-- ============ GRID CELLS ============ -->
  <g id="grid-cells" stroke="#dde3ea" fill="#fbfcfd">
    <rect x="282" y="300" width="152" height="50" rx="4"/>
    <rect x="446" y="300" width="152" height="50" rx="4"/>
    <rect x="610" y="300" width="152" height="50" rx="4"/>
    <rect x="774" y="300" width="152" height="50" rx="4"/>

    <rect x="282" y="360" width="152" height="50" rx="4"/>
    <rect x="446" y="360" width="152" height="50" rx="4"/>
    <rect x="610" y="360" width="152" height="50" rx="4"/>
    <rect x="774" y="360" width="152" height="50" rx="4"/>

    <rect x="282" y="420" width="152" height="50" rx="4"/>
    <rect x="446" y="420" width="152" height="50" rx="4"/>
    <rect x="610" y="420" width="152" height="50" rx="4"/>
    <rect x="774" y="420" width="152" height="50" rx="4"/>

    <rect x="282" y="480" width="152" height="50" rx="4"/>
    <rect x="446" y="480" width="152" height="50" rx="4"/>
    <rect x="610" y="480" width="152" height="50" rx="4"/>
    <rect x="774" y="480" width="152" height="50" rx="4"/>
  </g>

  <g id="cell-dots" fill="#7d8b9c">
    <circle cx="358" cy="325" r="4"/><circle cx="522" cy="325" r="4"/><circle cx="686" cy="325" r="4"/><circle cx="850" cy="325" r="4"/>
    <circle cx="358" cy="385" r="4"/><circle cx="522" cy="385" r="4"/><circle cx="686" cy="385" r="4"/><circle cx="850" cy="385" r="4"/>
    <circle cx="358" cy="445" r="4"/><circle cx="522" cy="445" r="4"/><circle cx="686" cy="445" r="4"/><circle cx="850" cy="445" r="4"/>
    <circle cx="358" cy="505" r="4"/><circle cx="522" cy="505" r="4"/><circle cx="686" cy="505" r="4"/><circle cx="850" cy="505" r="4"/>
  </g>

  <!-- ============ FOOTNOTE ============ -->
  <g id="footnote">
    <line x1="40" y1="556" x2="960" y2="556" stroke="#e3e8ee"/>
    <text x="40" y="578" font-size="11.5" fill="#555">
      Interaction <tspan font-weight="bold" fill="#111">strength is frozen, not removed</tspan> — the hypothesis concerns whether that strength varies with environment, not whether interactions exist.
    </text>
    <text x="40" y="596" font-size="11.5" fill="#555">
      All scenarios share the same posterior draw and the same random seed, so differences are attributable to the freeze alone.
    </text>
  </g>

</svg>
