<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" font-family="Helvetica, Arial, sans-serif">

  <rect width="1000" height="520" fill="#ffffff"/>

  <!-- ============ TITLE ============ -->
  <g id="title">
    <text x="40" y="40" font-size="22" font-weight="bold" fill="#111">Expected resilience metrics</text>
    <text x="40" y="64" font-size="13" fill="#666">posterior mean and 95% credible interval, pooled across climate sequences</text>
    <text x="40" y="82" font-size="12" fill="#8e44ad">&#8220;Freeze&#8221; = interaction strength no longer varies with environment (&#969; = 0, &#948; = 0)</text>
  </g>

  <!-- ============ SHARED ROW LABELS ============ -->
  <g id="row-labels" font-size="11.5" fill="#111" text-anchor="end">
    <text x="150" y="140">Full</text>
    <text x="150" y="186">Freeze (b) interspecific</text>
    <text x="150" y="232">Freeze (a) intraspecific</text>
    <text x="150" y="278">Freeze both</text>
  </g>
  <g id="row-dots">
    <circle cx="164" cy="136" r="5" fill="#1a1a1a"/>
    <circle cx="164" cy="182" r="5" fill="#e67e22"/>
    <circle cx="164" cy="228" r="5" fill="#c0392b"/>
    <circle cx="164" cy="274" r="5" fill="#8e44ad"/>
  </g>

  <!-- ============ PANEL A : TEMPORAL STABILITY ============ -->
  <g id="panel-stability">
    <text x="190" y="100" font-size="13" font-weight="bold" fill="#111">Temporal stability</text>
    <text x="190" y="116" font-size="10.5" fill="#777">mean / SD of total cover</text>

    <line x1="190" y1="300" x2="410" y2="300" stroke="#333" stroke-width="1.1"/>
    <text x="190" y="316" font-size="10" fill="#777" text-anchor="middle">low</text>
    <text x="410" y="316" font-size="10" fill="#777" text-anchor="middle">high</text>

    <g stroke-width="2">
      <line x1="374" y1="136" x2="408" y2="136" stroke="#1a1a1a"/>
      <line x1="318" y1="182" x2="372" y2="182" stroke="#e67e22"/>
      <line x1="262" y1="228" x2="322" y2="228" stroke="#c0392b"/>
      <line x1="194" y1="274" x2="268" y2="274" stroke="#8e44ad"/>
    </g>
    <g>
      <circle cx="391" cy="136" r="5.5" fill="#1a1a1a"/>
      <circle cx="345" cy="182" r="5.5" fill="#e67e22"/>
      <circle cx="292" cy="228" r="5.5" fill="#c0392b"/>
      <circle cx="231" cy="274" r="5.5" fill="#8e44ad"/>
    </g>
    <line x1="391" y1="128" x2="391" y2="286" stroke="#1a1a1a" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.4"/>
  </g>

  <!-- ============ PANEL B : RESISTANCE ============ -->
  <g id="panel-resistance">
    <text x="450" y="100" font-size="13" font-weight="bold" fill="#111">Resistance</text>
    <text x="450" y="116" font-size="10.5" fill="#777">1 − depth of drop in dry years</text>

    <line x1="450" y1="300" x2="670" y2="300" stroke="#333" stroke-width="1.1"/>
    <text x="450" y="316" font-size="10" fill="#777" text-anchor="middle">low</text>
    <text x="670" y="316" font-size="10" fill="#777" text-anchor="middle">high</text>

    <g stroke-width="2">
      <line x1="628" y1="136" x2="666" y2="136" stroke="#1a1a1a"/>
      <line x1="580" y1="182" x2="634" y2="182" stroke="#e67e22"/>
      <line x1="522" y1="228" x2="584" y2="228" stroke="#c0392b"/>
      <line x1="454" y1="274" x2="530" y2="274" stroke="#8e44ad"/>
    </g>
    <g>
      <circle cx="647" cy="136" r="5.5" fill="#1a1a1a"/>
      <circle cx="607" cy="182" r="5.5" fill="#e67e22"/>
      <circle cx="553" cy="228" r="5.5" fill="#c0392b"/>
      <circle cx="492" cy="274" r="5.5" fill="#8e44ad"/>
    </g>
    <line x1="647" y1="128" x2="647" y2="286" stroke="#1a1a1a" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.4"/>
  </g>

  <!-- ============ PANEL C : RECOVERY ============ -->
  <g id="panel-recovery">
    <text x="710" y="100" font-size="13" font-weight="bold" fill="#111">Recovery rate</text>
    <text x="710" y="116" font-size="10.5" fill="#777">1 / years to return to baseline</text>

    <line x1="710" y1="300" x2="930" y2="300" stroke="#333" stroke-width="1.1"/>
    <text x="710" y="316" font-size="10" fill="#777" text-anchor="middle">slow</text>
    <text x="930" y="316" font-size="10" fill="#777" text-anchor="middle">fast</text>

    <g stroke-width="2">
      <line x1="886" y1="136" x2="926" y2="136" stroke="#1a1a1a"/>
      <line x1="838" y1="182" x2="892" y2="182" stroke="#e67e22"/>
      <line x1="778" y1="228" x2="842" y2="228" stroke="#c0392b"/>
      <line x1="714" y1="274" x2="790" y2="274" stroke="#8e44ad"/>
    </g>
    <g>
      <circle cx="906" cy="136" r="5.5" fill="#1a1a1a"/>
      <circle cx="865" cy="182" r="5.5" fill="#e67e22"/>
      <circle cx="810" cy="228" r="5.5" fill="#c0392b"/>
      <circle cx="752" cy="274" r="5.5" fill="#8e44ad"/>
    </g>
    <line x1="906" y1="128" x2="906" y2="286" stroke="#1a1a1a" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.4"/>
  </g>

  <!-- ============ CONTRIBUTION BRACKET ============ -->
  <g id="contribution">
    <path d="M 420 136 L 432 136 L 432 274 L 420 274" fill="none" stroke="#666" stroke-width="1.2"/>
    <text x="438" y="200" font-size="10.5" fill="#666">contribution</text>
    <text x="438" y="213" font-size="10.5" fill="#666">of each</text>
    <text x="438" y="226" font-size="10.5" fill="#666">interaction type</text>
  </g>

  <!-- ============ PREDICTION BOX ============ -->
  <g id="prediction">
    <rect x="40" y="356" width="920" height="128" rx="6" fill="#f4f6f8" stroke="#cfd7e0"/>
    <text x="58" y="382" font-size="13" font-weight="bold" fill="#111">H2 — what would support it</text>

    <circle cx="66" cy="404" r="3.5" fill="#555"/>
    <text x="80" y="408" font-size="12" fill="#333">All three metrics decline when interaction strength stops responding to environment.</text>

    <circle cx="66" cy="428" r="3.5" fill="#555"/>
    <text x="80" y="432" font-size="12" fill="#333">The <tspan font-weight="bold" fill="#c0392b">(a) intraspecific</tspan> freeze produces the larger single-term decline.</text>

    <circle cx="66" cy="452" r="3.5" fill="#555"/>
    <text x="80" y="456" font-size="12" fill="#333"><tspan font-weight="bold" fill="#8e44ad">Freeze both</tspan> is the lower bound: the total contribution of context-dependence.</text>

    <circle cx="66" cy="476" r="3.5" fill="#555"/>
    <text x="80" y="480" font-size="12" fill="#333">If intervals overlap Full, that metric offers no support — report it as such.</text>
  </g>

</svg>
